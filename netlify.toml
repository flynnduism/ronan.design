[build]
publish = "dist"
command = "parcel build index.html 404.html resume.html && cp llms.txt dist/ && cp resume.md dist/"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/forty"
  to = "https://app.formbricks.com/s/clp0d9klc04phqs0ftf6p698z"
  status = 302

[[redirects]]
  from = "/resume"
  to = "/resume.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404